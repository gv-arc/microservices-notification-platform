# NATS Server with JetStream and authentication
#
# Credentials are injected at runtime through environment variables.
# Do NOT put real credentials in this file.
#
# Required environment variables:
#   NATS_USER_PUBLISHER
#   NATS_USER_CONSUMER
#   NATS_PASSWORD

port: 4222
monitor_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_mem: 256MB
  max_file: 1GB
}

authorization {
  users = [
    {
      # User Service
      user: $NATS_USER_PUBLISHER
      password: $NATS_PASSWORD

      permissions: {
        # Publish user events
        publish: [
          "events.user.>",

          # JetStream stream management
          "$JS.API.STREAM.CREATE.USER_EVENTS",
          "$JS.API.STREAM.INFO.USER_EVENTS"
        ]

        # Receive JetStream API responses
        subscribe: [
          "_INBOX.>"
        ]
      }
    },

    {
      # Notification Service
      user: $NATS_USER_CONSUMER
      password: $NATS_PASSWORD

      permissions: {
        # Used for JetStream API requests and message acknowledgements
        publish: [
          "_INBOX.>",

          # Durable consumer creation/info
          "$JS.API.CONSUMER.DURABLE.CREATE.USER_EVENTS.>",
          "$JS.API.CONSUMER.INFO.USER_EVENTS.>",

          # JetStream message acknowledgements
          "$JS.ACK.USER_EVENTS.>"
        ]

        # Receive user events and JetStream API responses
        subscribe: [
          "events.user.>",
          "_INBOX.>"
        ]
      }
    }
  ]
}
