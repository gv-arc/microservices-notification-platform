# NATS Server with JetStream and token-based authentication
port: 4222
monitor_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_mem: 256MB
  max_file: 1GB
}

authorization {
  users = [
    {
      user: "app_user"
      password: "nats_secret"
      permissions: {
        publish: ["events.user.>"]
        subscribe: ["events.user.>", "_INBOX.>"]
      }
    },
    {
      user: "notification_user"
      password: "nats_secret"
      permissions: {
        publish: ["_INBOX.>"]
        subscribe: ["events.user.>", "_INBOX.>"]
      }
    }
  ]
}
