# NATS Server with JetStream and authentication
# Note: Users and passwords are injected at runtime via environment variables
# in docker-compose.yml and should be defined in .env file

port: 4222
monitor_port: 8222

jetstream {
  store_dir: /data/jetstream
  max_mem: 256MB
  max_file: 1GB
}

# Authorization credentials must be provided at runtime
# Set NATS_USER_PUBLISHER, NATS_USER_CONSUMER, and NATS_PASSWORD in environment
# This configuration is a template; actual users are defined via Docker environment

authorization {
  users = [
    {
      user: $NATS_USER_PUBLISHER
      password: $NATS_PASSWORD
      permissions: {
        publish: ["events.user.>"]
        subscribe: ["events.user.>", "_INBOX.>"]
      }
    },
    {
      user: $NATS_USER_CONSUMER
      password: $NATS_PASSWORD
      permissions: {
        publish: ["_INBOX.>"]
        subscribe: ["events.user.>", "_INBOX.>"]
      }
    }
  ]
}
