server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: notification-service
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_USER:notification_app}
    password: ${MYSQL_PASSWORD:notification_secret}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

nats:
  url: ${NATS_URL:nats://localhost:4222}
  username: ${NATS_USERNAME:app_user}
  password: ${NATS_PASSWORD:nats_secret}
  stream-name: ${NATS_STREAM:USER_EVENTS}
  subject: ${NATS_SUBJECT:events.user}
  durable-name: ${NATS_DURABLE:notification-service-consumer}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-32-chars}
  gateway-token: ${GATEWAY_TOKEN:gateway-internal-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info
