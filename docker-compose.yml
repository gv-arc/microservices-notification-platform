services:
  mysql:
    image: mysql:8.4
    container_name: ms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infrastructure/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: ms-nats
    command: ["-c", "/etc/nats/nats-server.conf", "-js"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
      - ./infrastructure/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    environment:
      NATS_USER_PUBLISHER: ${NATS_USER_PUBLISHER}
      NATS_USER_CONSUMER: ${NATS_USER_CONSUMER}
      NATS_PASSWORD: ${NATS_PASSWORD}

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: ms-user-service
    depends_on:
      mysql:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      SERVER_PORT: ${SERVER_PORT:-8081}
      MYSQL_URL: jdbc:mysql://mysql:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      NATS_URL: nats://nats:4222
      NATS_USERNAME: ${NATS_USER_PUBLISHER}
      NATS_PASSWORD: ${NATS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
    ports:
      - "8081:8081"

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: ms-notification-service
    depends_on:
      mysql:
        condition: service_healthy
      nats:
        condition: service_started
      user-service:
        condition: service_started
    environment:
      SERVER_PORT: ${SERVER_PORT:-8082}
      MYSQL_URL: jdbc:mysql://mysql:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true
      MYSQL_USER: ${NOTIFICATION_MYSQL_USER}
      MYSQL_PASSWORD: ${NOTIFICATION_MYSQL_PASSWORD}
      NATS_URL: nats://nats:4222
      NATS_USERNAME: ${NATS_USER_CONSUMER}
      NATS_PASSWORD: ${NATS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
    ports:
      - "8082:8082"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: ms-api-gateway
    depends_on:
      - user-service
      - notification-service
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      USER_SERVICE_URL: http://user-service:8081
      NOTIFICATION_SERVICE_URL: http://notification-service:8082
      JWT_SECRET: ${JWT_SECRET}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8080:8080"

volumes:
  mysql_data:
  nats_data:
